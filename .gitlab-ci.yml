# Placeholders: enable once build images/runners for these distributions exist.
# They are also the first two with KF6, i.e. where openfortigui-runner comes back
# (build steps then: cd krunner_openfortigui && debuild ... like the app).
#
# build-ubuntu-2604-64-release:  image iteas-build-ubuntu-2604-64, tags k8s-iteas-prod
# build-debian-13-64-release:    tags build-debian-13-64

update_repo-release:
  stage: update_repo
  script:
    - update_build_release

  tags:
    - build-ubuntu-2204-64

  only:
    - tags

update_repo-dev:
  stage: update_repo
  script:
    - update_build_dev

  tags:
    - build-ubuntu-2204-64

  only:
    - master
    - qt6
