# CI for the qt6 line (0.9.11+).
#
# Qt6 packages exist only where Qt 6 and debhelper-compat 13 do: Ubuntu 24.04+,
# Debian bookworm+. Ubuntu 20.04/22.04 and Debian 10/11 stay on the 0.9.10 line
# (master keeps its own copy of this file) -- their jobs are gone here on purpose:
# a v* tag triggers every tag job, and a single failing distro would abort the
# release upload halfway.
#
# The KRunner plugin needs KDE Frameworks 6 (Ubuntu 26.04 / Debian trixie);
# Ubuntu 24.04 and bookworm ship KF5 only, so no runner package is built here
# until runners for those distributions exist -- see the placeholders below.
# GitHub Actions (.github/workflows/build-deb.yml) covers 26.04/trixie builds
# via distribution containers in the meantime.

# Is performed before the scripts in the stages step
before_script:
  - source /etc/profile || true

# Defines stages which are to be executed
stages:
  - build
  - update_repo

.build_template: &build_template_def
  before_script:
    - export CI_T_DATE=`LANG=C date -R`
    - cd openfortigui
    - touch ./debian/changelog
    - echo ""                                                                             > ./debian/changelog
    - echo "openfortigui (99.9.${CI_PIPELINE_ID}-1) precise; urgency=low"                >> ./debian/changelog
    - echo ""                                                                            >> ./debian/changelog
    - echo "  * Dev build from qt6"                                                     >> ./debian/changelog
    - echo ""                                                                            >> ./debian/changelog
    - echo " -- Rene Hadler <rene@hadler.me>  ${CI_T_DATE}"                              >> ./debian/changelog
    - sed -i 's/\*version =.*/\*version = "99.9.'"${CI_PIPELINE_ID}"'-dev";/' ./config.h
    - cd ..

# Stage "ubuntu"
build-ubuntu-2404-64-release:
  image: git.styrion.net:4567/iteas/docker-build-images/iteas-build-ubuntu-2404-64
  stage: build
  script:
    - cd openfortigui
    - git submodule init && git submodule update
    - echo "y" | debuild -eDEB_BUILD_OPTIONS="parallel=4" -us -uc
    - cd .. && mkdir build
    - mv openfortigui_*.deb build/
    - upload_build_release build/openforti*.deb || true

  # The files which are to be made available in GitLab
  artifacts:
    paths:
      - build/*

  tags:
    - k8s-iteas-prod

  only:
    - tags

# Stage "ubuntu-dev"
build-ubuntu-2404-64-dev:
  <<: *build_template_def
  image: git.styrion.net:4567/iteas/docker-build-images/iteas-build-ubuntu-2404-64
  stage: build
  script:
    - cd openfortigui
    - git submodule init && git submodule update
    - echo "y" | debuild -eDEB_BUILD_OPTIONS="parallel=4" -us -uc
    - cd .. && mkdir build
    - mv openfortigui_*.deb build/
    - upload_build_dev build/openforti*.deb || true

  # The files which are to be made available in GitLab
  artifacts:
    paths:
      - build/*

  tags:
    - k8s-iteas-prod

  only:
    - master
    - qt6

# Stage "debian"
build-debian-12-64:
  stage: build
  script:
    - cd openfortigui
    - git submodule init && git submodule update
    - echo "y" | debuild -eDEB_BUILD_OPTIONS="parallel=4" -us -uc
    - cd .. && mkdir build
    - mv openfortigui_*.deb build/
    - upload_build_release build/openforti*.deb || true

  # The files which are to be made available in GitLab
  artifacts:
