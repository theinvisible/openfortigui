name: Debian packages

# The one and only CI: builds every push, publishes version tags to the iteas
# apt repository. The build itself lives in packaging/build-deb.sh, which is the
# same script the distribution test case (tests/fortigate-vm/cases/91_distro.sh)
# runs inside a container -- so what CI builds is what was tested locally.
#
# The jobs run in distribution containers rather than on runner images: dh_shlibdeps
# writes the build host's Qt version into the dependencies, so a package has to be
# built on the distribution it is meant for, and GitHub offers no runner for most
# of these.
#
# Publishing (v* tags only) follows the tiBackup recipe: the .debs go to the
# aptly REST API -- upload, add to the per-codename repo iteas-<codename>, fresh
# snapshot, publish under filesystem:iteas:iteas. aptly signs the Release
# server-side (GpgKey + PassphraseFile live on the aptly host), so CI only needs
# basic auth, never key material. Pushes to master/qt6 stay workflow artifacts.
#
# Requires repository secrets:
#   * APTLY_API  - base URL of the aptly REST API INCLUDING the /api suffix,
#                  e.g. https://apt-api.example.com/api (kept out of this file);
#                  without /api aptly answers 404 early and the proxy turns the
#                  aborted upload into a misleading 502
#   * APTLY_AUTH - HTTP basic auth "user:password" for the aptly API

on:
  push:
    branches: [master, qt6]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:bookworm
          - debian:trixie

    steps:
      # git has to be there before checkout, otherwise the action falls back to a
      # tarball download and the openfortivpn submodule stays empty.
      - name: Prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates dpkg-dev lintian

      - name: Detect distribution
        run: |
          . /etc/os-release
          echo "CODENAME=${VERSION_CODENAME}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Build dependencies come from debian/control; the script installs them.
      - name: Build the package
        run: packaging/build-deb.sh openfortigui out

      # The same version is built for several distributions -- carry the codename
      # in the file name so the publish job can tell them apart after the
      # artifact merge.
      - name: Stamp the codename into the file names
        run: |
          cd out
          for f in *.deb; do
            arch="${f##*_}"; rest="${f%_*}"
            mv "$f" "${rest}_${CODENAME}_${arch}"
          done
          ls -l

      # Informational: packaging complaints should be visible without blocking a
      # release.
      - name: lintian
        continue-on-error: true
        run: lintian --no-tag-display-limit out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: openfortigui-deb-${{ env.CODENAME }}
          path: out/*.deb
          if-no-files-found: error

  # The KRunner plugin needs KDE Frameworks 6. Ubuntu 24.04 and Debian bookworm
  # ship KF5 only, so they are absent from this list -- the KF5 version of the
  # plugin was dropped with the port.
  runner:
    name: runner ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:26.04
          - debian:trixie

    steps:
      - name: Prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates dpkg-dev lintian

      - name: Detect distribution
        run: |
          . /etc/os-release
          echo "CODENAME=${VERSION_CODENAME}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The plugin compiles the application's own sources from ../openfortigui,
      # which is why the whole tree is needed here as well.
      - name: Build the plugin package
        run: packaging/build-deb.sh krunner_openfortigui out

      - name: Stamp the codename into the file names
        run: |
          cd out
          for f in *.deb; do
            arch="${f##*_}"; rest="${f%_*}"
            mv "$f" "${rest}_${CODENAME}_${arch}"
          done
          ls -l

      - name: lintian
        continue-on-error: true
        run: lintian --no-tag-display-limit out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: openfortigui-runner-deb-${{ env.CODENAME }}
          path: out/*.deb
          if-no-files-found: error

  # One serial job publishes everything: the legs share the aptly prefix
  # filesystem:iteas:iteas, and concurrent DELETE/POST publish cycles would race.
  # App and runner package of the same codename land in one snapshot/publish
  # cycle.
  publish:
    name: publish to apt.iteas.at
    needs: [package, runner]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true

      - name: Publish to iteas apt repository
        shell: bash
        env:
          APTLY_API: ${{ secrets.APTLY_API }}
          APTLY_AUTH: ${{ secrets.APTLY_AUTH }}
        run: |
          set -euo pipefail
          api="${APTLY_API}"
          curl_a=(curl --fail-with-body -sS -u "${APTLY_AUTH}")

          for oscode in noble resolute bookworm trixie; do
            debs=(debs/*_"${oscode}"_*.deb)
            if [[ ! -e "${debs[0]}" ]]; then
              echo "::error::no packages for ${oscode} -- did a build leg vanish?"
              exit 1
            fi
            echo "== ${oscode}: ${debs[*]}"
            updir="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${oscode}"

            # 1) upload the built .deb(s) into a per-run upload dir
            for deb in "${debs[@]}"; do
              "${curl_a[@]}" -X POST -F "file=@${deb}" "${api}/files/${updir}"
            done

            # 2) add the uploaded files to the shared per-codename local repo
            resp=$("${curl_a[@]}" -X POST "${api}/repos/iteas-${oscode}/file/${updir}")
            echo "$resp"
            echo "$resp" | grep -qE '"FailedFiles":[[:space:]]*\[[[:space:]]*\]' \
              || { echo "::error::aptly rejected one or more files for ${oscode}"; exit 1; }

            # 3) republish: drop old publication+snapshot (ignore 404 on first run),
            #    create a fresh snapshot, then publish it (Release signed by aptly)
            "${curl_a[@]}" -X DELETE "${api}/publish/filesystem:iteas:iteas/${oscode}" || true
            "${curl_a[@]}" -X DELETE "${api}/snapshots/${oscode}-publish" || true
            "${curl_a[@]}" -X POST -H 'Content-Type: application/json' \
              --data "{\"Name\":\"${oscode}-publish\"}" \
              "${api}/repos/iteas-${oscode}/snapshots"
            "${curl_a[@]}" -X POST -H 'Content-Type: application/json' \
              --data "{\"SourceKind\":\"snapshot\",\"Sources\":[{\"Name\":\"${oscode}-publish\"}],\"Architectures\":[\"i386\",\"amd64\"],\"Distribution\":\"${oscode}\",\"Signing\":{\"GpgKey\":\"23CAE45582EB0928\",\"PassphraseFile\":\"/root/gpg_passphrase_iteas\",\"Keyring\":\"/root/.gnupg/pubring.gpg\",\"SecretKeyring\":\"/root/.gnupg/secring.gpg\"}}" \
              "${api}/publish/filesystem:iteas:iteas"

            # 4) best-effort cleanup of the upload dir
            "${curl_a[@]}" -X DELETE "${api}/files/${updir}" || true
          done

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
